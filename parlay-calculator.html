<!-- PropsBot.AI — Parlay Calculator widget
     Self-contained HTML+CSS+JS. Paste inside a WordPress Custom HTML block.
     All styles scoped under .pb-parlay to avoid theme conflicts.
-->
<style>
  .pb-parlay * { box-sizing: border-box; }
  .pb-parlay {
    --pb-teal: #15ffc2;
    --pb-red: #ff1552;
    --pb-gold: #f0c040;
    --pb-blue: #22a9ec;
    --pb-purple: #AB8FFF;
    --pb-bg: #070e1a;
    --pb-surface: rgba(15,28,46,0.6);
    --pb-card: rgba(14,26,44,0.85);
    --pb-text: #eef2f7;
    --pb-text-2: rgba(200,215,230,0.78);
    --pb-text-3: rgba(150,180,210,0.5);
    --pb-border: rgba(100,200,220,0.07);
    --pb-border-2: rgba(120,160,200,0.12);
    --pb-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --pb-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --pb-grad: linear-gradient(135deg, #09d5a0, #22a9ec);

    font-family: var(--pb-ui);
    color: var(--pb-text);
    max-width: 720px;
    margin: 32px auto;
    padding: 28px;
    background: linear-gradient(165deg, rgba(30,45,65,0.6), rgba(18,30,50,0.5)), var(--pb-card);
    border: 1px solid var(--pb-border);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }
  .pb-parlay::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--pb-grad);
  }

  .pb-parlay__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .pb-parlay__title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin: 0;
    color: var(--pb-text);
  }
  .pb-parlay__brand {
    font-family: var(--pb-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--pb-teal);
    padding: 5px 10px;
    border-radius: 4px;
    background: rgba(21,255,194,0.06);
    border: 1px solid rgba(21,255,194,0.18);
  }

  .pb-parlay__legs-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pb-parlay__legs-title {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--pb-text-3);
  }
  .pb-parlay__count {
    font-family: var(--pb-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--pb-text-2);
  }

  .pb-parlay__legs {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .pb-parlay__leg {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    background: rgba(8,16,28,0.55);
    border: 1px solid var(--pb-border-2);
    border-radius: 10px;
    transition: border-color 160ms ease;
  }
  .pb-parlay__leg:focus-within { border-color: rgba(21,255,194,0.4); }
  .pb-parlay__leg-num {
    font-family: var(--pb-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--pb-text-3);
    min-width: 22px;
    text-align: center;
  }
  .pb-parlay__leg-input {
    width: 100%;
    padding: 8px 10px;
    background: rgba(8,16,28,0.7);
    border: 1.5px solid var(--pb-border-2);
    border-radius: 7px;
    color: var(--pb-text);
    font-family: var(--pb-mono);
    font-size: 14px;
    font-weight: 700;
    outline: none;
    transition: border-color 160ms ease;
  }
  .pb-parlay__leg-input:focus { border-color: rgba(21,255,194,0.5); }
  .pb-parlay__leg-input::placeholder { color: rgba(150,180,210,0.3); font-weight: 400; }
  .pb-parlay__leg-decimal {
    font-family: var(--pb-mono);
    font-size: 11px;
    color: var(--pb-text-2);
    min-width: 50px;
    text-align: right;
    font-weight: 600;
  }
  .pb-parlay__leg-decimal--invalid { color: var(--pb-red); }
  .pb-parlay__leg-remove {
    width: 28px;
    height: 28px;
    border: 1px solid var(--pb-border-2);
    background: transparent;
    color: var(--pb-text-3);
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 140ms ease;
    line-height: 1;
    padding: 0;
  }
  .pb-parlay__leg-remove:hover {
    color: var(--pb-red);
    border-color: rgba(255,21,82,0.4);
    background: rgba(255,21,82,0.06);
  }
  .pb-parlay__leg-remove[disabled] { opacity: 0.3; cursor: not-allowed; }

  .pb-parlay__add {
    width: 100%;
    padding: 11px;
    background: rgba(21,255,194,0.04);
    border: 1.5px dashed rgba(21,255,194,0.3);
    border-radius: 9px;
    color: var(--pb-teal);
    font-family: var(--pb-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: all 140ms ease;
  }
  .pb-parlay__add:hover {
    background: rgba(21,255,194,0.08);
    border-color: rgba(21,255,194,0.5);
  }

  .pb-parlay__bet-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 18px;
  }
  .pb-parlay__bet-input-wrap {
    position: relative;
  }
  .pb-parlay__bet-input {
    width: 100%;
    padding: 14px 18px 14px 36px;
    background: rgba(8,16,28,0.7);
    border: 1.5px solid var(--pb-border-2);
    border-radius: 10px;
    color: var(--pb-text);
    font-family: var(--pb-mono);
    font-size: 18px;
    font-weight: 700;
    outline: none;
    transition: border-color 160ms ease;
  }
  .pb-parlay__bet-input:focus { border-color: rgba(21,255,194,0.5); }
  .pb-parlay__bet-currency {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--pb-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--pb-text-3);
    pointer-events: none;
  }

  .pb-parlay__result {
    margin-top: 22px;
    padding: 22px;
    background: linear-gradient(160deg, rgba(21,255,194,0.05), rgba(8,16,28,0.7));
    border: 1px solid rgba(21,255,194,0.16);
    border-radius: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .pb-parlay__result--invalid {
    background: linear-gradient(160deg, rgba(255,21,82,0.05), rgba(8,16,28,0.7));
    border-color: rgba(255,21,82,0.18);
  }
  .pb-parlay__metric {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pb-parlay__metric-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--pb-text-3);
  }
  .pb-parlay__metric-value {
    font-family: var(--pb-mono);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--pb-teal);
    line-height: 1.1;
  }
  .pb-parlay__metric-value--gold { color: var(--pb-gold); }
  .pb-parlay__metric-value--muted { color: var(--pb-text-2); font-size: 16px; }
  .pb-parlay__metric-sub {
    font-family: var(--pb-mono);
    font-size: 10px;
    color: var(--pb-text-3);
    margin-top: 2px;
  }

  .pb-parlay__cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 22px;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(21,255,194,0.07), rgba(34,169,236,0.07));
    border: 1px solid rgba(21,255,194,0.22);
    border-radius: 12px;
    flex-wrap: wrap;
  }
  .pb-parlay__cta-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--pb-text);
    letter-spacing: -0.1px;
  }
  .pb-parlay__cta-text span {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--pb-text-2);
    margin-top: 2px;
    letter-spacing: 0;
  }
  .pb-parlay__cta-btn {
    padding: 10px 18px;
    background: var(--pb-grad);
    color: #051018;
    font-family: var(--pb-ui);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.3px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 120ms ease, box-shadow 200ms ease;
    box-shadow: 0 4px 14px rgba(21,255,194,0.18);
    white-space: nowrap;
  }
  .pb-parlay__cta-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(21,255,194,0.28); }
  .pb-parlay__cta-btn:active { transform: translateY(0); }

  @media (max-width: 520px) {
    .pb-parlay { padding: 20px; margin: 20px 12px; }
    .pb-parlay__title { font-size: 16px; }
    .pb-parlay__result { grid-template-columns: 1fr; gap: 14px; }
    .pb-parlay__metric-value { font-size: 22px; }
    .pb-parlay__leg { grid-template-columns: auto 1fr auto; gap: 6px; padding: 8px 10px; }
    .pb-parlay__leg-decimal { display: none; }
    .pb-parlay__bet-input { font-size: 16px; }
  }
</style>

<div class="pb-parlay" role="region" aria-label="Parlay Calculator">
  <div class="pb-parlay__header">
    <h2 class="pb-parlay__title">Parlay Calculator</h2>
    <span class="pb-parlay__brand">PropsBot.AI</span>
  </div>

  <div class="pb-parlay__legs-label">
    <span class="pb-parlay__legs-title">Legs (American Odds)</span>
    <span class="pb-parlay__count" id="pb-parlay-count">2 legs</span>
  </div>

  <div class="pb-parlay__legs" id="pb-parlay-legs"></div>

  <button class="pb-parlay__add" id="pb-parlay-add" type="button">+ Add Another Leg</button>

  <div class="pb-parlay__bet-row">
    <label class="pb-parlay__legs-title" for="pb-parlay-bet" style="margin-bottom:4px;">Bet Amount</label>
    <div class="pb-parlay__bet-input-wrap">
      <span class="pb-parlay__bet-currency">$</span>
      <div id="pb-parlay-bet-mount"></div>
    </div>
  </div>

  <div class="pb-parlay__result" id="pb-parlay-result" aria-live="polite">
    <div class="pb-parlay__metric">
      <span class="pb-parlay__metric-label">Total Payout</span>
      <span class="pb-parlay__metric-value" id="pb-parlay-payout">—</span>
      <span class="pb-parlay__metric-sub" id="pb-parlay-profit">Profit: —</span>
    </div>
    <div class="pb-parlay__metric">
      <span class="pb-parlay__metric-label">Combined Odds</span>
      <span class="pb-parlay__metric-value pb-parlay__metric-value--gold" id="pb-parlay-american">—</span>
      <span class="pb-parlay__metric-sub" id="pb-parlay-decimal">— decimal · — implied</span>
    </div>
  </div>

  <div class="pb-parlay__cta">
    <div class="pb-parlay__cta-text">
      Building a smarter parlay?
      <span>Get PropsBot AI Confidence Scores on every leg before you submit.</span>
    </div>
    <a class="pb-parlay__cta-btn" href="https://app.propsbot.ai/" rel="noopener">Try PropsBot Free</a>
  </div>
</div>
