<!-- PropsBot.AI — Parlay Calculator widget
     Self-contained HTML+CSS+JS. Paste inside a WordPress Custom HTML block.
     All styles scoped under .pb-parlay to avoid theme conflicts.
-->
<!-- CSS loaded via WPCode CSS snippet (PropsBot Tools Calculator CSS) -->
<div class="pb-parlay" role="region" aria-label="Parlay Calculator">
  <div class="pb-parlay__header">
    <h2 class="pb-parlay__title">Parlay Calculator</h2>
    <span class="pb-parlay__brand">PropsBot.AI</span>
  </div>

  <div class="pb-parlay__legs-label">
    <span class="pb-parlay__legs-title">Legs (American Odds)</span>
    <span class="pb-parlay__count" id="pb-parlay-count">2 legs</span>
  </div>

  <div class="pb-parlay__legs" id="pb-parlay-legs"></div>

  <button class="pb-parlay__add" id="pb-parlay-add" type="button">+ Add Another Leg</button>

  <div class="pb-parlay__bet-row">
    <label class="pb-parlay__legs-title" for="pb-parlay-bet" style="margin-bottom:4px;">Bet Amount</label>
    <div class="pb-parlay__bet-input-wrap">
      <span class="pb-parlay__bet-currency">$</span>
      <div id="pb-parlay-bet-mount"></div>
    </div>
  </div>

  <div class="pb-parlay__result" id="pb-parlay-result" aria-live="polite">
    <div class="pb-parlay__metric">
      <span class="pb-parlay__metric-label">Total Payout</span>
      <span class="pb-parlay__metric-value" id="pb-parlay-payout">—</span>
      <span class="pb-parlay__metric-sub" id="pb-parlay-profit">Profit: —</span>
    </div>
    <div class="pb-parlay__metric">
      <span class="pb-parlay__metric-label">Combined Odds</span>
      <span class="pb-parlay__metric-value pb-parlay__metric-value--gold" id="pb-parlay-american">—</span>
      <span class="pb-parlay__metric-sub" id="pb-parlay-decimal">— decimal · — implied</span>
    </div>
  </div>

  <div class="pb-parlay__cta">
    <div class="pb-parlay__cta-text">
      Building a smarter parlay?
      <span>Get PropsBot AI Confidence Scores on every leg before you submit.</span>
    </div>
    <a class="pb-parlay__cta-btn" href="https://app.propsbot.ai/" rel="noopener">Try PropsBot Free</a>
  </div>
</div>
